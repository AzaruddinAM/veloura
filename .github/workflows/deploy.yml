# Tests, builds and deploys Veloura to Hostinger on every push to main.
#
# Only files whose content changed are uploaded (and files removed from the build
# are removed from the server). The first run uploads everything once; after that
# each deploy sends just the difference. Never touched on the server:
#   public_html/media/   product photos uploaded in the admin panel
#   veloura/.env         your settings
#   veloura/storage/     logs, sessions, cache
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER     e.g. ftp.velourajewels.online (hPanel > Files > FTP Accounts)
#   FTP_USERNAME   e.g. u123456789.velourajewels.online
#   FTP_PASSWORD
# Optional repository variables, if your FTP account opens in a different folder:
#   FTP_PUBLIC_DIR (default: domains/velourajewels.online/public_html/)
#   FTP_APP_DIR    (default: domains/velourajewels.online/veloura/)

name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'release/**'
      - '.vscode/**'
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  PUBLIC_DIR: ${{ vars.FTP_PUBLIC_DIR || 'domains/velourajewels.online/public_html/' }}
  APP_DIR: ${{ vars.FTP_APP_DIR || 'domains/velourajewels.online/veloura/' }}

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, fileinfo, pdo_sqlite
          coverage: none
      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    name: Build and upload changed files
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ---------- Build ----------
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build shop and admin panel
        run: |
          npm ci
          npm run build
          npm run build:admin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install PHP packages (production)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      # ---------- Same layout as the Hostinger package ----------
      - name: Assemble upload folders
        run: |
          set -e
          mkdir -p out/public_html out/veloura

          # public_html: shop + admin panel + entry point that loads ../veloura
          cp -r dist/veloura/browser/. out/public_html/
          cp -r backend/public/adminpannel out/public_html/adminpannel
          cp backend/public/.htaccess backend/public/robots.txt backend/public/favicon.ico out/public_html/
          cp deploy/hostinger/index.php out/public_html/index.php

          # veloura: backend code only (no settings, storage, tests or dev files)
          rsync -a backend/ out/veloura/ \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'storage/' --exclude 'public/' --exclude 'tests/' \
            --exclude 'node_modules/' --exclude 'bootstrap/cache/*.php' \
            --exclude 'resources/css/' --exclude 'resources/js/' \
            --exclude 'package.json' --exclude 'vite.config.js' --exclude 'phpunit.xml' \
            --exclude '.phpunit.result.cache' --exclude '*.md' \
            --exclude '.editorconfig' --exclude '.gitattributes' --exclude '.npmrc'

          echo "public_html: $(find out/public_html -type f | wc -l) files"
          echo "veloura:     $(find out/veloura -type f | wc -l) files"

      # ---------- Upload only what changed ----------
      # The action keeps a list of file hashes on the server (.ftp-deploy-sync-state.json)
      # and compares against it, so unchanged files are skipped.
      # Tidy the FTP_SERVER secret (drops ftp://, spaces, newlines, a trailing / or :21)
      # and stop with a clear message if the name still can't be found.
      - name: Check FTP server name
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$RAW" ]; then echo "::error::The FTP_SERVER secret is empty or missing (Settings > Secrets and variables > Actions > Repository secrets)."; exit 1; fi
          host=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^[A-Za-z]+://##; s#[/:].*$##')
          echo "::add-mask::$host"
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          case "$RAW" in *://*) echo "Note: removed a protocol (like ftp://) from FTP_SERVER.";; esac
          [ "$RAW" != "$(printf '%s' "$RAW" | tr -d '[:space:]')" ] && echo "Note: removed spaces/newlines from FTP_SERVER."
          if getent hosts "$host" > /dev/null; then
            echo "FTP server name found (${#host} characters)."
          else
            echo "::error::FTP_SERVER (after tidying: ${#host} characters, starts with '${host:0:4}') is not a server name that exists. Set it to exactly: ftp.velourajewels.online"
            exit 1
          fi

      - name: Upload public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/public_html/
          server-dir: ${{ env.PUBLIC_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            media/**

      - name: Upload backend (veloura)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/veloura/
          server-dir: ${{ env.APP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .env
            storage/**

      # The shop's product list is cached on the server until something is edited in
      # the admin panel; clear it so the new code's response is served right away.
      - name: Clear server cache
        env:
          FTP_SERVER: ${{ env.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:verify-certificate no;
            cd '${APP_DIR}storage/framework/cache';
            rm -r -f data;
            mkdir -f data;
            bye" || echo "Could not clear the cache (it refreshes on the next admin edit)."
