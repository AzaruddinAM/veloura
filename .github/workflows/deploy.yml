# Tests, builds and deploys Veloura to Hostinger on every push to main.
#
# Only changed files are replaced. The workflow builds the version that is live
# (the commit saved on the server in veloura/.deployed-commit) and the new version,
# compares the two builds file by file, then over FTP:
#   - uploads only files that are new or different
#   - deletes only files the new version no longer has
#   - leaves every other file on the server as it is
# Never touched: public_html/media/ (product photos), veloura/.env, veloura/storage/.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER     ftp.velourajewels.online or the server IP (hPanel > Files > FTP Accounts)
#   FTP_USERNAME
#   FTP_PASSWORD
# Optional repository variables:
#   FTP_PUBLIC_DIR / FTP_APP_DIR  only if the automatic folder search (deploy/locate.sh) fails
#   DEPLOY_BASE    commit that is live when the server has no veloura/.deployed-commit yet
#                  (default: 46b55e3, the version uploaded by hand on 2 Nov 2026)

name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'release/**'
      - '.vscode/**'
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

env:
  # Found automatically over FTP (deploy/locate.sh); set these variables only to override.
  FTP_PUBLIC_DIR: ${{ vars.FTP_PUBLIC_DIR }}
  FTP_APP_DIR: ${{ vars.FTP_APP_DIR }}
  DEPLOY_BASE: ${{ vars.DEPLOY_BASE || '46b55e3a9d9bae4774d2ca3401b168070feb4ffa' }}

jobs:
  test:
    name: Test backend
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, fileinfo, pdo_sqlite
          coverage: none
      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    name: Upload changed files
    timeout-minutes: 30
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to build the live version too
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null

      # Tidy the FTP_SERVER secret (drops ftp://, spaces, newlines, a trailing / or :21).
      - name: Check FTP settings
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$RAW" ]; then echo "::error::The FTP_SERVER secret is empty or missing."; exit 1; fi
          host=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^[A-Za-z]+://##; s#[/:].*$##')
          echo "::add-mask::$host"
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          if [[ "$host" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || getent hosts "$host" > /dev/null; then
            echo "FTP server found."
          else
            echo "::error::FTP_SERVER (${#host} characters, starts with '${host:0:4}') is not a server that exists. Use ftp.velourajewels.online"
            exit 1
          fi
          # Shared lftp settings: one connection, passive mode, TLS when offered, retries.
          cat > "$RUNNER_TEMP/lftp-settings" <<'EOF'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          set cmd:fail-exit yes
          EOF

      - name: Find the site and backend folders
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash deploy/locate.sh

      - name: Find the live version
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          live=$(timeout 90 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST" \
                   -e "source $RUNNER_TEMP/lftp-settings; set cmd:fail-exit no; set net:max-retries 1; cat ${APP_DIR}.deployed-commit; bye" 2>/dev/null | tr -d '[:space:]' || true)
          if [ -n "$live" ]; then echo "Live version (from the server): $live"; else live=$DEPLOY_BASE; echo "No .deployed-commit on the server yet; using DEPLOY_BASE: $live"; fi
          if ! git cat-file -e "$live^{commit}" 2>/dev/null; then echo "::error::Live commit $live is not in this repository."; exit 1; fi
          echo "LIVE=$(git rev-parse "$live")" >> "$GITHUB_ENV"

      - name: Build the new version
        run: bash deploy/assemble.sh . "$RUNNER_TEMP/new" deploy/hostinger/index.php

      - name: Build the live version (to compare against)
        run: |
          git worktree add -q "$RUNNER_TEMP/live-src" "$LIVE"
          bash deploy/assemble.sh "$RUNNER_TEMP/live-src" "$RUNNER_TEMP/old" deploy/hostinger/index.php

      - name: List changed files
        run: |
          s="$RUNNER_TEMP/upload.lftp"; sum="$RUNNER_TEMP/summary.md"
          echo "### Deploy ${LIVE:0:7} → ${GITHUB_SHA:0:7}" > "$sum"
          bash deploy/plan.sh "$RUNNER_TEMP/old/public_html" "$RUNNER_TEMP/new/public_html" "$PUBLIC_DIR" "$s.1" "$sum"
          bash deploy/plan.sh "$RUNNER_TEMP/old/veloura" "$RUNNER_TEMP/new/veloura" "$APP_DIR" "$s.2" "$sum"
          # Upload the backend first, then the site, so new pages never call old code.
          cat "$s.2" "$s.1" > "$s"
          # Remove the state file left by the earlier deploy tool, if any (it was public).
          echo "rm -f \"${PUBLIC_DIR}.ftp-deploy-sync-state.json\"" >> "$s"
          # Record what is live now, then clear the cached product list.
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/.deployed-commit"
          echo "put \"$RUNNER_TEMP/.deployed-commit\" -o \"${APP_DIR}.deployed-commit\"" >> "$s"
          echo "set cmd:fail-exit no" >> "$s"
          echo "rm -r -f \"${APP_DIR}storage/framework/cache/data\"" >> "$s"
          echo "mkdir -f \"${APP_DIR}storage/framework/cache/data\"" >> "$s"
          cat "$sum" >> "$GITHUB_STEP_SUMMARY"
          grep -c '^put\|^rm' "$s" | xargs echo "FTP actions:"

      - name: Upload changed files
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST" \
            -e "source $RUNNER_TEMP/lftp-settings; source $RUNNER_TEMP/upload.lftp; bye"
          echo "Deployed ${GITHUB_SHA:0:7}."
